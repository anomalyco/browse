[package]
name = "browse-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
browse-core.workspace = true
browse-cdp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
url = "2"

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
browse-page.workspace = true
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake", "connect"] }
