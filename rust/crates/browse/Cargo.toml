[package]
name = "browse"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "browse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
browse-core.workspace = true
browse-relay.workspace = true
browse-page.workspace = true
browse-capture.workspace = true
browse-script.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
