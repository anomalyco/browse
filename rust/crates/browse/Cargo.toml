[package]
name = "browse"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "browse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
browse-core.workspace = true
browse-relay.workspace = true
browse-page.workspace = true
browse-capture.workspace = true
browse-script.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "macros"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
serde_yaml = "0.9"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
# Only to tell a rejected chain (ureq wraps it in Error::Io) from other IO errors; ureq already builds this version.
rustls = { version = "0.23", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake", "connect"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
