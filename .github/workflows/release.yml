# Releases browse: the extension zip and the @opencode/browse npm package.
#   push to dev       dev:    <next>-dev.<run> (scripts/version.ts): the unpacked extension zip and the npm tarball to
#                             Anomaly's release service (anoma.ly/release, channel dev, GitHub OIDC), then npm dist-tag dev,
#                             all in environment release-dev (no approval); no store upload, no tag, no GitHub release
#   workflow_dispatch with ref (default production) and channel:
#     check (default)   verify, build, check and attest, never publish; ref dev builds the dev version, any other ref
#                       rehearses the version in cli/package.json
#     dev               the dev build above, by hand; only from dev
#     stable            only from production (ref production): npm dist-tag latest and the public store item
#                       (vars.CWS_ITEM_ID), in environments npm and chrome-web-store (approved). Only after both published
#                       does the last job tag v<version> on the released commit and create the GitHub release, so a
#                       failed run leaves no tag. Tags trigger nothing.
# `bun run release` (scripts/release.ts) bumps the version on dev, fast-forwards production and dispatches stable.
# RELEASING.md has the one-time setup.
#
# dev:    verify -> build -> attest -> publish-release (release-dev) -> publish-npm (release-dev)
# stable: verify -> build -> attest -> publish-npm (npm) + publish-cws (chrome-web-store) -> github-release (tag + release)
# The artifacts are built once in `build`, from the one commit `verify` resolved, and passed along; nothing is rebuilt
# after the checks.
name: Release

on:
  push:
    branches: [dev]
    # Docs alone cut no dev build.
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (stable takes production only)
        required: true
        default: production
      channel:
        description: check (build, check and attest; publish nothing), dev (the dev build; from dev), or stable (from production)
        type: choice
        options: [check, dev, stable]
        default: check

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
  # Never cancel a release halfway through publishing. Of the dev pushes that land during a dev run, only the newest
  # waits (GitHub replaces an older pending run in the group), so a busy dev branch still publishes about once per run.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # mode: check | dev | stable; channel: the npm dist-tag (dev | latest); every later job builds and publishes sha.
      - name: Commit, version, channel and whether to publish
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          sha="$(git rev-parse HEAD)"
          stable="$(node -p 'require("./cli/package.json").version')"
          tag=""
          case "$MODE" in
            stable)
              if [ "$EVENT" != workflow_dispatch ] || [ "$REF_NAME" != production ] || [ "$INPUT_REF" != production ]; then
                echo "::error::Stable releases are dispatched from production with ref production, not ${REF_NAME} (ref ${INPUT_REF})."
                exit 1
              fi
              # The commit the workflow file came from: production must not have moved since the dispatch.
              if [ "$sha" != "$GITHUB_SHA" ]; then
                echo "::error::production moved from $GITHUB_SHA to $sha after the dispatch; run it again."
                exit 1
              fi
              version="$stable" channel=latest publish=true tag="v$stable"
              if gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref' | grep -qx "refs/tags/$tag"; then
                echo "::error::$tag already exists; release a new version with bun run release."
                exit 1
              fi
              ;;
            dev)
              if [ "$REF_NAME" != dev ] || { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_REF" != dev ]; }; then
                echo "::error::Dev builds run from dev with ref dev, not ${REF_NAME} (ref ${INPUT_REF})."
                exit 1
              fi
              # Stamped into the checkout only (never committed); the build job stamps the same version.
              version="$(bun scripts/version.ts dev --run "$RUN_NUMBER" --attempt "$RUN_ATTEMPT")" channel=dev publish=true
              ;;
            check)
              publish=false
              if [ "$INPUT_REF" = dev ]; then
                version="$(bun scripts/version.ts dev --run "$RUN_NUMBER" --attempt "$RUN_ATTEMPT")" channel=dev
              else
                version="$stable" channel=latest
              fi
              ;;
            *) echo "::error::Unknown channel $MODE."; exit 1 ;;
          esac
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "channel=$channel"
            echo "mode=$MODE"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $sha ($MODE, npm dist-tag $channel, publish: $publish)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install (extension)
        run: bun install --frozen-lockfile

      - name: Install (cli)
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Versions agree (cli/package.json, package.json, manifest) and the changelog is ready
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          if [ "$CHANNEL" = dev ]; then
            # Dev builds have no changelog entry; the GitHub commit is their notes.
            bun scripts/release-check.ts --versions-only
          elif [ -n "$TAG" ]; then
            bun scripts/release-check.ts --versions-only --tag "$TAG" --require-changelog
            bun scripts/changelog.ts check "$VERSION"
          else
            # A check run: the changelog entry comes with `bun run release`, so only warn.
            bun scripts/release-check.ts --versions-only
            bun scripts/changelog.ts check "$VERSION" || echo "::warning::changelog/$VERSION.md is missing or not ready; a stable release would fail here."
          fi

      - name: Typecheck (extension)
        run: bun run typecheck

      - name: Typecheck (cli)
        run: bun run typecheck
        working-directory: cli

      - name: Build (extension)
        run: bun run build

      - name: Build (cli)
        run: bun build.ts
        working-directory: cli

      - name: Test
        run: bun run test

  build:
    name: Build and check artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (extension)
        run: bun install --frozen-lockfile

      - name: Install (cli)
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Stamp the dev version
        if: needs.verify.outputs.channel == 'dev'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/version.ts set "$VERSION"

      # The extension zip (the store zip, or a dev build's unpacked zip), the npm tarball (with the store item ID, and a
      # dev build's zip sha256, baked in: cli/build.ts), the artifact checks and SHA256SUMS: the same script as
      # `bun run release:check`.
      - name: Build and check the extension zip and npm tarball
        env:
          OPENCODE_BROWSER_STORE_ID: ${{ vars.CWS_ITEM_ID }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then bun scripts/release-check.ts --tag "$TAG" --require-changelog
          else bun scripts/release-check.ts; fi

      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/changelog.ts notes "$VERSION" > release/NOTES.md || echo "No changelog entry for $VERSION (dry run)." > release/NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/*.zip
            release/*.tgz
            release/SHA256SUMS
            release/NOTES.md
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest build provenance
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job mints an OIDC token for Sigstore, and it runs no repository code.
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Checksums match
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Keep the attestation bundle with the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" release/attestation.sigstore.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: release/attestation.sigstore.json
          if-no-files-found: error
          retention-days: 30

  # Dev builds only: the unpacked extension zip and the npm tarball to Anomaly's release service, the way Hex and
  # Deadbolt publish (scripts/release-service.sh). The job's OIDC token is the only credential; the service checks it
  # against its registry entry for browse (repository, workflow, refs/heads/dev, environment release-dev).
  publish-release:
    name: Publish to the release service
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.channel == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No reviewers (every push to dev publishes); admits only dev (RELEASING.md).
    environment:
      name: release-dev
      url: https://anoma.ly/release/browse/extension/dev/chromium/info
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      # Only for scripts/release-service.sh; the files come from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release-service.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          for file in release/*.zip release/*.tgz; do
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done

      - name: Publish
        env:
          RELEASE: https://anoma.ly/release
          BROWSE_VERSION: ${{ needs.verify.outputs.version }}
          BROWSE_RELEASE_CHANNEL: dev
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.verify.outputs.sha }}
        run: |
          sh scripts/release-service.sh publish release
          {
            echo "### Release service (dev)"
            echo
            echo "- Extension: $RELEASE/browse/extension/dev/chromium"
            echo "- npm tarball: $RELEASE/browse/cli/dev/npm"
            for manifest in release/manifest-*.json; do
              echo
              echo "#### $(basename "$manifest")"
              echo '```json'
              cat "$manifest"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish to npm
    # Dev: after the release service has the extension zip the package fetches. Stable: publish-release is skipped.
    needs: [verify, attest, publish-release]
    if: >-
      ${{ !cancelled() && needs.verify.outputs.publish == 'true' && needs.attest.result == 'success'
      && (needs.publish-release.result == 'success'
      || (needs.verify.outputs.channel != 'dev' && needs.publish-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Stable: required reviewers approve before this job starts, and npm admits only production. Dev: release-dev has no
    # reviewers (every push to dev publishes) and admits only dev (RELEASING.md).
    environment:
      name: ${{ needs.verify.outputs.channel == 'dev' && 'release-dev' || 'npm' }}
      url: https://www.npmjs.com/package/@opencode/browse/v/${{ needs.verify.outputs.version }}
    permissions:
      # npm trusted publishing (OIDC) and the provenance statement.
      id-token: write
      # gh attestation verify, below.
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The files about to be published are the ones this run built and attested (not just consistent with SHA256SUMS,
      # which travels in the same artifact): GitHub's attestation for each digest, signed by this workflow.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for file in release/*.zip release/*.tgz; do
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 11.5.1+ for trusted publishing.
          node-version: 24
          package-manager-cache: false

      - name: Publish the built tarball
        working-directory: release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          # Temporary until trusted publishing is configured on npmjs.com; then delete the secret and npm uses OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sha256sum -c SHA256SUMS
          # Only write a token when there is one, so an empty value never stands in for OIDC.
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          unset NPM_TOKEN
          if [ "$(npm view "@opencode/browse@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@opencode/browse@$VERSION is already on npm; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish "./opencode-browse-$VERSION.tgz" --provenance --access public --tag "$CHANNEL"
          echo "Published @opencode/browse@$VERSION with dist-tag $CHANNEL." | tee -a "$GITHUB_STEP_SUMMARY"

  # Stable only: every store upload is reviewed, too slow for a build per push, so dev builds never go to the store.
  publish-cws:
    name: Publish to the Chrome Web Store
    needs: [verify, attest]
    if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers approve first; admits only production.
    environment:
      name: chrome-web-store
    permissions:
      contents: read
      attestations: read
    steps:
      # Only for scripts/cws.ts; the zip comes from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            package.json
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # The files about to be published are the ones this run built and attested (not just consistent with SHA256SUMS,
      # which travels in the same artifact): GitHub's attestation for each digest, signed by this workflow.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for file in "release/opencode-browser-$VERSION.zip" "release/opencode-browse-$VERSION.tgz"; do
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done

      - name: Upload and submit for review
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          if [ -z "$CWS_ITEM_ID" ]; then
            echo "::error::No store item: set the repository variable CWS_ITEM_ID (RELEASING.md)."
            exit 1
          fi
          bun scripts/cws.ts publish --zip "release/opencode-browser-$VERSION.zip" --version "$VERSION"

  # Last, once npm and the store both have the version: tags v<version> on the released commit and creates the GitHub
  # release, with the built-in token (contents: write here only). A failed run leaves no tag; tags trigger nothing.
  github-release:
    name: Tag and GitHub release
    needs: [verify, attest, publish-npm, publish-cws]
    if: needs.verify.outputs.mode == 'stable' && needs.publish-npm.result == 'success' && needs.publish-cws.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected tag $TAG."; exit 1; }
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")"
          if [ -n "$existing" ]; then
            # A rerun: the tag this run pushed earlier.
            [ "$existing" = "$SHA" ] || { echo "::error::$TAG already names $existing, not $SHA."; exit 1; }
            echo "$TAG already names $SHA."
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null
            echo "Tagged $SHA as $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          ATTESTATION: ${{ needs.attest.outputs.url }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          {
            cat NOTES.md
            echo
            echo "## Install"
            echo
            printf '%snpx @opencode/browse install%s\n' '`' '`'
            echo
            echo "## Verify"
            echo
            echo "Build provenance: $ATTESTATION"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify opencode-browser-$VERSION.zip --repo $GH_REPO"
            echo "gh attestation verify opencode-browse-$VERSION.tgz --repo $GH_REPO"
            echo '```'
          } > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "opencode-browser-$VERSION.zip" "opencode-browse-$VERSION.tgz" SHA256SUMS attestation.sigstore.json
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file body.md \
              "opencode-browser-$VERSION.zip" "opencode-browse-$VERSION.tgz" SHA256SUMS attestation.sigstore.json
          fi
