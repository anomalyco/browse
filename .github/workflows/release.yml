name: Release
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Release {0} {1}', inputs.bump, inputs.version) || '' }}"

# Releases browse: the extension zip, the @opencode/browse npm package (a Node launcher for the native binary) and the
# browse binaries, built from the Rust workspace in rust/ (an npm package @opencode/browse-<target> per platform, and
# the same targets on Anomaly's release service, which the install script downloads). RELEASING.md has the flow and the
# setup.
#
#   push to dev                        dev:    <next>-dev.<run> to the release service (extension + every binary
#                                              target) and npm dist-tag dev
#   dispatch on dev, bump or version   stable: tag v<version>, the release service (extension + every binary target),
#                                              npm latest, the Chrome Web Store, the GitHub release;
#                                              repository admins and maintainers only, release_notes required
#   dispatch without bump or version   check:  builds, checks and attests the stable artifacts; every publish script
#                                              runs as a dry run and publishes nothing
#
# Builds are separated from publishing:
# - build, build-binary and build-binaries run repository code (bun install, typecheck, tests, scripts/release-check.ts,
#   cargo, scripts/npm-package.ts) with no environment, secrets or id-token, and upload the artifacts with a SHA256SUMS
#   whose digest they output (build-binary's per-target executables are only build-binaries' input).
# - sign-macos and sign-windows (optional, off until the repository variables MACOS_SIGNING and WINDOWS_SIGNING are
#   true) run only .github/release/ scripts. sign-windows signs through Azure Trusted Signing over OIDC, with the Azure
#   ids as repository variables (there is no Azure secret).
# - tag runs only .github/release/tag-release.sh (git and jq) with the release deploy key.
# - attest and every publish job check out only .github/release/, verify each artifact against the digest of the job
#   that made it (and the attestation), and run those scripts on the artifacts as data. They never execute repository
#   code. Jobs that hold a secret or publish run in environment release, which admits only dev.
# - the jobs that need an AWS secret (tag, sign-macos, publish-cws, push-release-to-dev) assume
#   arn:aws:iam::604439173067:role/github/browse-release over GitHub OIDC in environment release and read only the
#   secrets they use from AWS Secrets Manager; the Chrome Web Store ids are repository variables.
# .github/ (CODEOWNERS) is the security boundary for releases.

on:
  push:
    branches: [dev]
    # Docs alone cut no dev build.
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      bump:
        description: "check: build, check and attest, publish nothing. patch, minor, major: a stable release from dev"
        required: false
        type: choice
        options: [check, patch, minor, major]
        default: check
      version:
        description: Exact stable version instead of a bump (optional)
        required: false
        type: string
      release_notes:
        description: Required with bump or version. A summary line, then ## Major / ## Improvements / ## Fixes (bun run release drafts them)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.bump != 'check' || inputs.version) && 'stable' || github.event_name }}
  # Never cancel a release halfway through publishing. Of the dev pushes that land during a dev run, only the newest
  # waits (GitHub replaces an older pending run in the group).
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The Rust toolchain every build uses, and the Linux cross-compilers (build-binary).
  RUST_TOOLCHAIN: "1.99.1"
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  CARGO_ZIGBUILD_VERSION: "0.24.1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      build_id: ${{ steps.plan.outputs.build_id }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        name: Plan
        run: bash .github/release/plan-release.sh
        env:
          GH_TOKEN: ${{ github.token }} # reads cli/package.json and the triggering actor's repository role
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}

  # Stable only: commits the versions and changelog/<version>.md on the dispatched dev commit and pushes only the tag
  # v<version>, with the release deploy key (the only actor besides the code owners the v* tag ruleset admits).
  # Runs git and jq only.
  tag:
    name: Tag
    needs: plan
    if: needs.plan.outputs.mode == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/browse-release
          role-session-name: browse-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the release tag key
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: RELEASE_TAG_KEY,browse/release/RELEASE_TAG_KEY
          parse-json-secrets: false
      # Without the key the checkout falls back to the workflow token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ env.RELEASE_TAG_KEY }}
      - id: tag
        name: Tag
        run: bash .github/release/tag-release.sh
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_RELEASE_NOTES: ${{ inputs.release_notes }}

  # ---- Build: repository code; no environment, secrets or id-token -------------------------------------------------

  build:
    name: Build and check
    needs: [plan, tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (extension)
        run: bun install --frozen-lockfile

      # Stamped into the checkout only (never committed).
      - name: Stamp the dev version
        if: needs.plan.outputs.mode == 'dev'
        run: bun scripts/version.ts set "$VERSION"

      - name: Versions agree (cli/package.json, package.json, manifest, rust/) and the changelog is ready
        run: |
          bun scripts/release-check.ts --versions-only
          [ "$(node -p 'require("./cli/package.json").version')" = "$VERSION" ] || { echo "::error::The checkout isn't version $VERSION."; exit 1; }
          if [ "$MODE" = stable ]; then bun scripts/changelog.ts check "$VERSION"; fi

      - name: Typecheck (extension and scripts)
        run: bun run typecheck

      - name: Test (extension)
        run: bun test ./test

      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"

      - name: Test (rust)
        working-directory: rust
        run: cargo test --workspace --locked

      # The extension zip (the store zip, or a dev build's unpacked zip) and the npm launcher tarball
      # (scripts/npm-package.ts), with the artifact checks: `bun run release:check`. The npm install check runs in
      # build-binaries, once there is a binary for it to launch.
      - name: Build and check the extension zip and npm tarball
        env:
          OPENCODE_BROWSER_STORE_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          if [ "$MODE" = stable ]; then bun scripts/release-check.ts --tag "v$VERSION" --require-changelog
          else bun scripts/release-check.ts; fi

      - id: upload
        name: Upload
        uses: ./.github/release/upload
        with:
          name: build
          path: release

  # One browse binary per build (rust/script/release.sh's names): Linux cross-compiled with cargo-zigbuild (zig cc
  # also builds QuickJS, browse-script's C code; the gnu builds against glibc 2.17), macOS with Xcode's clang on an
  # arm64 runner, Windows with MSVC and a static C runtime. The version and the run's build id are baked in
  # (BROWSE_VERSION, BROWSE_BUILD_ID: crates/browse/src/main.rs, serve.rs). The -baseline targets reuse these: Rust's
  # x86-64 target doesn't use AVX2.
  build-binary:
    name: Build ${{ matrix.build }}
    needs: [plan, tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.17, run: true }
          - { build: linux-x64-musl, runner: ubuntu-24.04, triple: x86_64-unknown-linux-musl, zig: x86_64-unknown-linux-musl, run: true }
          - { build: linux-arm64, runner: ubuntu-24.04, triple: aarch64-unknown-linux-gnu, zig: aarch64-unknown-linux-gnu.2.17 }
          - { build: linux-arm64-musl, runner: ubuntu-24.04, triple: aarch64-unknown-linux-musl, zig: aarch64-unknown-linux-musl }
          - { build: darwin-arm64, runner: macos-15, triple: aarch64-apple-darwin, run: true }
          - { build: darwin-x64, runner: macos-15, triple: x86_64-apple-darwin }
          - { build: windows-x64, runner: windows-2025, triple: x86_64-pc-windows-msvc, run: true }
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Stamp the dev version
        if: needs.plan.outputs.mode == 'dev'
        run: bun scripts/version.ts set "$VERSION"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TRIPLE"
          rustup default "$RUST_TOOLCHAIN"
        env:
          TRIPLE: ${{ matrix.triple }}

      # Zig from ziglang.org, checked against its published SHA-256; cargo-zigbuild from crates.io with its lockfile.
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"

      - name: Build
        working-directory: rust
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_BUILD_ID: ${{ needs.plan.outputs.build_id }}
          TRIPLE: ${{ matrix.triple }}
          ZIG_TARGET: ${{ matrix.zig }}
          BUILD: ${{ matrix.build }}
          # No Visual C++ runtime to depend on: not every Windows has it.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          [ "$(node -p 'require("../cli/package.json").version')" = "$VERSION" ] || { echo "::error::The checkout isn't version $VERSION."; exit 1; }
          if [ -n "$ZIG_TARGET" ]; then cargo zigbuild --release --locked -p browse --target "$ZIG_TARGET"
          else cargo build --release --locked -p browse --target "$TRIPLE"; fi
          exe=browse; case "$BUILD" in windows-*) exe=browse.exe ;; esac
          mkdir -p "$RUNNER_TEMP/out/$BUILD"
          cp "target/$TRIPLE/release/$exe" "$RUNNER_TEMP/out/$BUILD/$exe"
          ls -l "$RUNNER_TEMP/out/$BUILD/$exe"

      - name: Run it
        if: matrix.run
        env:
          BUILD: ${{ matrix.build }}
        run: |
          exe=browse; case "$BUILD" in windows-*) exe=browse.exe ;; esac
          actual=$("$RUNNER_TEMP/out/$BUILD/$exe" --version | tr -d '\r')
          [ "$actual" = "$VERSION" ] || { echo "::error::$BUILD --version printed $actual, expected $VERSION"; exit 1; }
          echo "$BUILD: $actual"
          "$RUNNER_TEMP/out/$BUILD/$exe" tools > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ matrix.build }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  # The platform packages: opencode-browse-<target>-<version>.tgz for every install script target (scripts/npm-package.ts,
  # which checks each binary's format, CPU, C library and glibc floor), from build-binary's executables. Then the
  # linux-x64 ones as users get them: the install script against a local copy of the release service, the relay and MCP
  # server, and `npm install` of build's @opencode/browse next to its platform package.
  build-binaries:
    name: Build binaries
    needs: [plan, tag, build, build-binary]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-binary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      NPM_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Stamp the dev version
        if: needs.plan.outputs.mode == 'dev'
        run: bun scripts/version.ts set "$VERSION"

      - name: Download the build
        uses: ./.github/release/download
        with:
          pattern: build
          digests: build=${{ needs.build.outputs.digest }}

      - name: Download the Rust builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-*
          path: ${{ runner.temp }}/rust
          merge-multiple: true

      - name: Pack the platform packages
        run: |
          [ "$(node -p 'require("./cli/package.json").version')" = "$VERSION" ] || { echo "::error::The checkout isn't version $VERSION."; exit 1; }
          bun scripts/npm-package.ts platforms --binaries "$RUNNER_TEMP/rust" --out "$RUNNER_TEMP/binaries"

      - name: Smoke test the linux-x64 binaries
        run: |
          for target in linux-x64 linux-x64-baseline linux-x64-musl linux-x64-baseline-musl; do
            dir=$(mktemp -d)
            tar -xzf "$RUNNER_TEMP/binaries/opencode-browse-$target-$VERSION.tgz" -C "$dir"
            actual=$("$dir/package/bin/browse" --version)
            [ "$actual" = "$VERSION" ] || { echo "::error::$target --version printed $actual, expected $VERSION"; exit 1; }
            echo "$target: $actual"
          done

      # The install script reads the channel manifest and downloads the tarball the way it does from
      # https://anoma.ly/release; here both come from a local server.
      - name: Install script against a local release service
        run: |
          set -eu
          channel=stable; [ "$NPM_CHANNEL" = dev ] && channel=dev
          file="opencode-browse-linux-x64-$VERSION.tgz"
          root=$(mktemp -d)
          mkdir -p "$root/release/browse/cli" "$root/release/files"
          cp "$RUNNER_TEMP/binaries/$file" "$root/release/files/"
          size=$(wc -c < "$root/release/files/$file" | tr -d ' ')
          sum=$(sha256sum "$root/release/files/$file" | cut -d' ' -f1)
          printf '{"schema":1,"app":"browse","artifact":"cli","channel":"%s","release":{"version":"%s","targets":{"linux-x64":{"url":"/release/files/%s","size":%s,"sha256":"%s"}}}}\n' \
            "$channel" "$VERSION" "$file" "$size" "$sum" > "$root/release/browse/cli/$channel.json"
          (cd "$root" && exec python3 -m http.server 29987 --bind 127.0.0.1) > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin OPENCODE_BROWSER_RELEASE_SERVICE=http://127.0.0.1:29987/release \
            sh ./install --channel "$channel" --no-setup
          actual=$("$home/.local/bin/browse" --version)
          [ "$actual" = "$VERSION" ] || { echo "::error::the install script installed $actual, expected $VERSION"; exit 1; }
          echo "installed: $actual"

      # `browse serve` is the relay; `browse mcp` serves the tools through it.
      - name: Smoke test the relay and MCP server
        run: |
          set -eu
          dir=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/binaries/opencode-browse-linux-x64-$VERSION.tgz" -C "$dir"
          binary="$dir/package/bin/browse"
          home=$(mktemp -d)
          port=29988
          relay=
          trap 'if [ -n "$relay" ]; then kill "$relay" 2>/dev/null || true; fi' EXIT
          env -i HOME="$home" PATH=/usr/bin:/bin OPENCODE_BROWSER_PORT="$port" OPENCODE_BROWSER_MANAGED_RELAY=1 \
            "$binary" serve > "$RUNNER_TEMP/relay.log" 2>&1 &
          relay=$!
          up=
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 "http://127.0.0.1:$port/version" > "$RUNNER_TEMP/version.json"; then up=1; break; fi
            kill -0 "$relay" 2>/dev/null || break
            sleep 0.5
          done
          if [ -z "$up" ]; then
            cat "$RUNNER_TEMP/relay.log"
            echo "::error::The relay from the linux-x64 binary did not answer /version."
            exit 1
          fi
          echo "relay: $(cat "$RUNNER_TEMP/version.json")"
          [ "$(jq -r .version "$RUNNER_TEMP/version.json")" = "$VERSION" ] || { echo "::error::The relay reports another version."; exit 1; }
          [ "$(jq -r .buildId "$RUNNER_TEMP/version.json")" = "$BUILD_ID" ] || { echo "::error::The relay reports another build id."; exit 1; }
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"0"}}}'
            sleep 2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | env -i HOME="$home" PATH=/usr/bin:/bin OPENCODE_BROWSER_PORT="$port" timeout 60 "$binary" mcp > "$RUNNER_TEMP/mcp.json" || true
          tools=$(grep -o '"name":"[a-z0-9_-]*"' "$RUNNER_TEMP/mcp.json" | wc -l)
          if [ "$tools" -lt 1 ]; then
            cat "$RUNNER_TEMP/mcp.json"
            echo "::error::The linux-x64 binary's MCP server listed no tools."
            exit 1
          fi
          echo "mcp: $tools tools"
        env:
          BUILD_ID: ${{ needs.plan.outputs.build_id }}

      - name: npm install of @opencode/browse with its linux-x64 package
        run: >-
          bun scripts/check-artifacts.ts --version "$VERSION"
          --tarball "$RUNNER_TEMP/in/build/opencode-browse-$VERSION.tgz"
          --platform-tarball "$RUNNER_TEMP/binaries/opencode-browse-linux-x64-$VERSION.tgz"

      - id: upload
        name: Upload
        uses: ./.github/release/upload
        with:
          name: binaries
          path: ${{ runner.temp }}/binaries

  # OPTIONAL, off by default: signs the macOS binaries with a Developer ID (hardened runtime, .github/release/entitlements/
  # cli.plist) once the repository variable MACOS_SIGNING is true. The certificate comes from AWS Secrets Manager
  # (shared/APPLE_SIGNING_CERTIFICATE: a base64 .p12 without a password). Until then this job is skipped and the macOS
  # packages ship with the ad-hoc signature the Rust linker gives them, which runs: neither the install script's curl
  # nor npm sets quarantine.
  sign-macos:
    name: Sign the macOS binaries (optional)
    needs: [plan, build-binaries]
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && vars.MACOS_SIGNING == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: binaries
          digests: binaries=${{ needs.build-binaries.outputs.digest }}
      - name: Configure AWS credentials
        if: needs.plan.outputs.dry_run != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/browse-release
          role-session-name: browse-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the signing certificate
        if: needs.plan.outputs.dry_run != 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: APPLE_SIGNING_CERTIFICATE,shared/APPLE_SIGNING_CERTIFICATE
          parse-json-secrets: false
      # The sign script looks the identity up in build.keychain; codesign finds the key through the user search list.
      - name: Import certificate
        if: needs.plan.outputs.dry_run != 'true'
        run: |
          [ -n "$APPLE_SIGNING_CERTIFICATE" ] || { echo "::error::MACOS_SIGNING is true but AWS shared/APPLE_SIGNING_CERTIFICATE is empty."; exit 1; }
          cert="$RUNNER_TEMP/cert.p12"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$cert" -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
      - name: Sign
        run: bash .github/release/sign-macos.sh "$RUNNER_TEMP/in/binaries" "$RUNNER_TEMP/signed"
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      - id: upload
        name: Upload
        uses: ./.github/release/upload
        with:
          name: binaries-signed
          path: ${{ runner.temp }}/signed
      - name: Delete keychain
        if: always() && needs.plan.outputs.dry_run != 'true'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          security delete-keychain build.keychain || true

  # OPTIONAL, off by default: Authenticode-signs the Windows binaries through Azure Trusted Signing once the repository
  # variable WINDOWS_SIGNING is true. An unsigned browse.exe is blocked by Windows Smart App Control, so install fails.
  # The Azure ids are repository variables (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and the
  # AZURE_TRUSTED_SIGNING_* names below); Azure trusts this workflow's environment release over OIDC, so there is no
  # secret. Until then this job is skipped and the Windows packages ship unsigned.
  sign-windows:
    name: Sign the Windows binaries (optional)
    needs: [plan, build-binaries]
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && vars.WINDOWS_SIGNING == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: binaries
          digests: binaries=${{ needs.build-binaries.outputs.digest }}
      - name: Unpack
        run: bash .github/release/unpack-windows.sh "$RUNNER_TEMP/in/binaries" "$RUNNER_TEMP/work"
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Log in to Azure
        if: needs.plan.outputs.dry_run != 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign
        if: needs.plan.outputs.dry_run != 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          cache-dependencies: false
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe
          files-folder-recurse: true
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify and repack
        run: bash .github/release/repack-windows.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/signed"
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      - id: upload
        name: Upload
        uses: ./.github/release/upload
        with:
          name: binaries-windows-signed
          path: ${{ runner.temp }}/signed

  # ---- Attest and publish: only .github/release/ is checked out; artifacts are data ---------------------------------

  # Build provenance for the zip and every tarball (the signed macOS and Windows ones too, when those jobs ran). No
  # secrets; id-token only for Sigstore.
  attest:
    name: Attest build provenance
    needs: [plan, build, build-binaries, sign-macos, sign-windows]
    # Explicit: on dev runs tag is skipped, and the implicit success() would skip everything downstream of it.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.build-binaries.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: "{build,binaries,binaries-signed,binaries-windows-signed}"
          digests: >-
            build=${{ needs.build.outputs.digest }} binaries=${{ needs.build-binaries.outputs.digest }}
            binaries-signed=${{ needs.sign-macos.outputs.digest }}
            binaries-windows-signed=${{ needs.sign-windows.outputs.digest }}
      # Every file the artifacts list, by the checksums verify-artifacts.sh just checked; a signed macOS or Windows
      # tarball replaces the unsigned one of the same name, which is never published.
      - name: Subjects
        run: |
          sums=()
          for name in binaries-signed binaries-windows-signed binaries build; do
            if [ -f "$RUNNER_TEMP/in/$name/SHA256SUMS" ]; then sums+=("$RUNNER_TEMP/in/$name/SHA256SUMS"); fi
          done
          awk '!seen[substr($0, 67)]++' "${sums[@]}" > "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
      - name: Keep the attestation bundle with the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: mkdir -p "$RUNNER_TEMP/attestation" && cp "$BUNDLE" "$RUNNER_TEMP/attestation/attestation.sigstore.json"
      - id: upload
        name: Upload
        uses: ./.github/release/upload
        with:
          name: attestation
          path: ${{ runner.temp }}/attestation

  # Every channel: the extension zip and the CLI binaries to Anomaly's release service. Dev publishes from every push
  # to dev; stable from a dispatch on dev; a check run prints the same list as a dry run. The job's OIDC token is the
  # only credential; the service checks it against registry/browse.json (workflow, refs/heads/dev, environment release).
  publish-release-service:
    name: Publish to the release service
    needs: [plan, build, build-binaries, sign-macos, sign-windows, attest]
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success'
      && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: "{build,binaries,binaries-signed,binaries-windows-signed}"
          digests: >-
            build=${{ needs.build.outputs.digest }} binaries=${{ needs.build-binaries.outputs.digest }}
            binaries-signed=${{ needs.sign-macos.outputs.digest }}
            binaries-windows-signed=${{ needs.sign-windows.outputs.digest }}
      - name: Publish
        run: |
          macos= windows=
          if [ "$SIGN_MACOS" = success ]; then macos="$RUNNER_TEMP/in/binaries-signed"; fi
          if [ "$SIGN_WINDOWS" = success ]; then windows="$RUNNER_TEMP/in/binaries-windows-signed"; fi
          bash .github/release/publish-release-service.sh "$RUNNER_TEMP/in/build" "$RUNNER_TEMP/in/binaries" "$macos" "$windows"
        env:
          SIGN_MACOS: ${{ needs.sign-macos.result }}
          SIGN_WINDOWS: ${{ needs.sign-windows.result }}
          GH_TOKEN: ${{ github.token }}
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_CHANNEL: ${{ needs.plan.outputs.channel }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

  # After the release service has the extension zip the dev package fetches. A check run publishes with --dry-run and
  # no environment. The platform packages @opencode/browse-<target> first, then @opencode/browse.
  publish-npm:
    name: Publish to npm
    needs: [plan, build, build-binaries, sign-macos, sign-windows, attest, publish-release-service]
    if: >-
      ${{ !cancelled() && needs.attest.result == 'success'
      && needs.publish-release-service.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
      attestations: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11.5.1+ for trusted publishing
          package-manager-cache: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: "{build,binaries,binaries-signed,binaries-windows-signed}"
          digests: >-
            build=${{ needs.build.outputs.digest }} binaries=${{ needs.build-binaries.outputs.digest }}
            binaries-signed=${{ needs.sign-macos.outputs.digest }}
            binaries-windows-signed=${{ needs.sign-windows.outputs.digest }}
      - name: Publish
        run: |
          macos= windows=
          if [ "$SIGN_MACOS" = success ]; then macos="$RUNNER_TEMP/in/binaries-signed"; fi
          if [ "$SIGN_WINDOWS" = success ]; then windows="$RUNNER_TEMP/in/binaries-windows-signed"; fi
          bash .github/release/publish-npm.sh "$RUNNER_TEMP/in/build" "$RUNNER_TEMP/in/binaries" "$macos" "$windows"
        env:
          SIGN_MACOS: ${{ needs.sign-macos.result }}
          SIGN_WINDOWS: ${{ needs.sign-windows.result }}
          GH_TOKEN: ${{ github.token }}
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_NPM_TAG: ${{ needs.plan.outputs.npm_tag }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}

  # Stable (and check, as a dry run): every store upload is reviewed, too slow for a build per push, so dev builds
  # never go to the store.
  publish-cws:
    name: Publish to the Chrome Web Store
    needs: [plan, build, attest]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'latest' && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: build
          digests: build=${{ needs.build.outputs.digest }}
      - name: Configure AWS credentials
        if: needs.plan.outputs.dry_run != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/browse-release
          role-session-name: browse-${{ github.run_id }}
          aws-region: us-east-1
      # A dry run fetches none: publish-cws.sh checks the zip and uploads nothing without a refresh token.
      - name: Read the store credentials
        if: needs.plan.outputs.dry_run != 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CWS_CLIENT_SECRET,browse/release/CWS_CLIENT_SECRET
            CWS_REFRESH_TOKEN,browse/release/CWS_REFRESH_TOKEN
          parse-json-secrets: false
      - name: Upload and submit for review
        run: bash .github/release/publish-cws.sh "$RUNNER_TEMP/in/build"
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          CWS_CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}

  # Once npm and the store both have the version: the GitHub release on the tag the tag job pushed.
  publish-github-release:
    name: GitHub release
    needs: [plan, build, attest, publish-npm, publish-cws]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'latest' && needs.publish-npm.result == 'success' && needs.publish-cws.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.plan.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: "{build,attestation}"
          digests: build=${{ needs.build.outputs.digest }} attestation=${{ needs.attest.outputs.digest }}
      - name: Publish
        run: bash .github/release/publish-github-release.sh "$RUNNER_TEMP/in/build" "$RUNNER_TEMP/in/attestation"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          BROWSE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          BROWSE_RELEASE_NOTES: ${{ inputs.release_notes }}

  # Brings the release commit back to dev, so dev builds count up from the new version: pushed straight to dev with the
  # release deploy key (the dev ruleset admits it besides admins), replayed on the newest dev if dev moved. Git only.
  push-release-to-dev:
    name: Release commit to dev
    needs: [plan, tag, publish-github-release]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'stable' && needs.publish-github-release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/browse-release
          role-session-name: browse-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the release tag key
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: RELEASE_TAG_KEY,browse/release/RELEASE_TAG_KEY
          parse-json-secrets: false
      # Without the key the checkout falls back to the workflow token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ env.RELEASE_TAG_KEY }}
      - name: Push
        run: bash .github/release/push-release-to-dev.sh "$SHA"
        env:
          BROWSE_VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.tag.outputs.sha }}
