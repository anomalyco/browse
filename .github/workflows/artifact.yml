name: Artifact evals

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      build-id:
        type: string
        required: true
      binaries-id:
        type: string
      signed-id:
        type: string
      published:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.build-id }}
          path: eval-input/build
          merge-multiple: true
      - if: ${{ !inputs.published }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ runner.os == 'macOS' && inputs.signed-id || inputs.binaries-id }}
          path: eval-input/binaries
          merge-multiple: true
      - name: Run artifact checks
        shell: bash
        env:
          EVAL_BUILD_VERSION: ${{ inputs.version }}
          EVAL_BUILD_DIR: ${{ github.workspace }}/eval-input/build
          EVAL_BINARIES_DIR: ${{ github.workspace }}/eval-input/binaries
          EVAL_REGISTRY_WAIT_MS: '300000'
          PUBLISHED: ${{ inputs.published }}
        run: |
          args=()
          if [[ "$PUBLISHED" == true ]]; then args+=(--version "$EVAL_BUILD_VERSION"); fi
          bun evals/run.ts artifact "${args[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ inputs.published && 'published' || 'built' }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: evals/results/
          if-no-files-found: error
