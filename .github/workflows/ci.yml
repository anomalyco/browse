name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun from package.json's packageManager field.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The MCP server and relay run under Node (cli/package.json engines), and the execute sandbox tests run in it too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (extension)
        run: bun install --frozen-lockfile

      - name: Install (cli)
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Typecheck (extension)
        run: bun run typecheck

      - name: Typecheck (cli)
        run: bun run typecheck
        working-directory: cli

      - name: Build (extension)
        run: bun run build

      - name: Build (cli)
        run: bun build.ts
        working-directory: cli

      - name: Test (extension)
        run: bun test ./test

      - name: Test (cli)
        run: bun run test
        working-directory: cli

      # The store zip and npm tarball the release workflow would build, with its artifact checks (permission allowlist,
      # no key, pairing code, source maps or test hooks), so a problem shows up on the PR rather than at release time.
      - name: Release artifacts check
        run: bun run release:check

      # The release builds a binary per platform (cli/script/compile.ts); this host's one shows a compile break early.
      - name: Compile and pack the linux-x64 binary
        working-directory: cli
        run: |
          bun script/compile.ts linux-x64
          ./dist-bin/browse-linux-x64/bin/browse --version
          bun script/pack.ts

      # The scripts the release jobs that hold secrets run (.github/release/); shellcheck comes with the runner image.
      - name: Shellcheck release scripts
        run: shellcheck -x .github/release/*.sh

  windows-launch:
    name: Windows relay launch
    runs-on: windows-latest
    timeout-minutes: 20
    # Informational: the Windows launcher (kernel32 CreateProcessW, cli/src/relay/windows-launch.ts) and the compiled
    # browse.exe, which a failure here shouldn't block merges on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (extension)
        run: bun install --frozen-lockfile

      - name: Install (cli)
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Compile the windows-x64 binary
        run: bun script/compile.ts windows-x64
        working-directory: cli

      # The test spawns the binary from an isolated HOME, so give it an absolute path.
      - name: Test the compiled relay launch
        run: bun test test/windows-launch.test.ts
        working-directory: cli
        env:
          BROWSE_TEST_BINARY: ${{ github.workspace }}/cli/dist-bin/browse-windows-x64/bin/browse.exe

      - name: Test the source relay launch
        run: bun test test/windows-launch.test.ts
        working-directory: cli

  browser:
    name: Execute sandbox in headless Chromium (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational: a real-browser check of the execute sandbox; a failure here doesn't fail CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (extension)
        run: bun install --frozen-lockfile

      - name: Install (cli)
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build (extension)
        run: bun run build

      - name: Build (cli)
        run: bun build.ts
        working-directory: cli

      # The Chromium the pinned patchright-core expects, with its system libraries.
      - name: Install Chromium
        run: node node_modules/patchright-core/cli.js install --with-deps --no-shell chromium
        working-directory: cli

      - name: Execute sandbox browser harness
        run: node --no-warnings test/execute-realm-browser.ts
        working-directory: cli

      - name: Snapshot within selector harness
        run: bun test/snapshot-within-browser.ts
        working-directory: cli
