name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.inputs.outputs.artifact }}
      version: ${{ steps.inputs.outputs.version }}
      build-id: ${{ steps.build.outputs.artifact-id }}
      binaries-id: ${{ steps.binaries.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # The PR merge commit and its base parent, including for forks
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: inputs
        name: Select artifact targets
        run: |
          artifact=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD -- cli install install.ps1 scripts ':(glob)**/package*.json' ':(glob)**/bun.lock*' .github evals)
            if [[ -z "$changed" ]]; then artifact=false; fi
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./cli/package.json").version')" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: cli
      - name: Install Chromium
        run: node node_modules/patchright-core/cli.js install --with-deps --no-shell chromium
        working-directory: cli
      - name: PR checks
        env:
          EVAL_EXTRA_TARGETS: ${{ steps.inputs.outputs.artifact == 'true' && 'darwin-arm64 windows-x64 windows-x64-baseline' || '' }}
        run: bun evals/run.ts pr
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-pr-${{ github.run_attempt }}
          path: evals/results/
          if-no-files-found: error
      - id: build
        if: steps.inputs.outputs.artifact == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-input-build-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 3
      - id: binaries
        if: steps.inputs.outputs.artifact == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-input-binaries-${{ github.run_attempt }}
          path: cli/dist-bin/npm/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  artifact:
    needs: check
    if: needs.check.outputs.artifact == 'true'
    uses: ./.github/workflows/artifact.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.check.outputs.version }}
      build-id: ${{ needs.check.outputs.build-id }}
      binaries-id: ${{ needs.check.outputs.binaries-id }}
