name: Migrate secrets

# One-off: copy browse's release environment secrets from GitHub to AWS Secrets Manager,
# then prove the AWS copies are readable and the Chrome Web Store pair still refreshes.
# Uploads nothing to the store. Delete this workflow after it runs.
on:
  workflow_dispatch:
    inputs:
      copy:
        description: Copy the GitHub values over the AWS ones first
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/browse-release
          role-session-name: browse-migrate-${{ github.run_id }}
          aws-region: us-east-1

      - name: Copy GitHub environment secrets to AWS
        if: inputs.copy
        env:
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
        run: |
          set -euo pipefail
          umask 077
          file=$(mktemp)
          trap 'rm -f "$file"' EXIT
          copy() {
            local name=$1 id=$2
            if [ -z "${!name:-}" ]; then echo "::error::$name is empty"; exit 1; fi
            printf '%s' "${!name}" > "$file"
            aws secretsmanager put-secret-value --secret-id "$id" --secret-string "file://$file" > /dev/null
            echo "$name -> $id"
          }
          copy CWS_CLIENT_SECRET browse/release/CWS_CLIENT_SECRET
          copy CWS_REFRESH_TOKEN browse/release/CWS_REFRESH_TOKEN
          copy RELEASE_TAG_KEY browse/release/RELEASE_TAG_KEY

      - name: Read the secrets back from AWS
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CWS_CLIENT_SECRET,browse/release/CWS_CLIENT_SECRET
            CWS_REFRESH_TOKEN,browse/release/CWS_REFRESH_TOKEN
            RELEASE_TAG_KEY,browse/release/RELEASE_TAG_KEY
          parse-json-secrets: false

      - name: Verify the AWS values without publishing
        env:
          CWS_CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for name in CWS_CLIENT_SECRET CWS_REFRESH_TOKEN RELEASE_TAG_KEY; do
            [ -n "${!name:-}" ] || { echo "::error::$name is empty in AWS"; exit 1; }
            echo "$name ok"
          done
          printf '%s\n' "$RELEASE_TAG_KEY" > "$work/tag-key"
          chmod 600 "$work/tag-key"
          ssh-keygen -y -f "$work/tag-key" > "$work/tag-key.pub"
          echo "RELEASE_TAG_KEY valid SSH private key, $(awk 'END { print NR }' "$work/tag-key") lines"
          jq -jn --arg id "$CWS_CLIENT_ID" --arg secret "$CWS_CLIENT_SECRET" --arg refresh "$CWS_REFRESH_TOKEN" \
            '"client_id=\($id | @uri)&client_secret=\($secret | @uri)&refresh_token=\($refresh | @uri)&grant_type=refresh_token"' > "$work/form"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" --data-binary "@$work/form")
          echo "CWS token refresh HTTP $status"
          [ "$status" = 200 ]
