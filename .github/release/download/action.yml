name: Download release artifacts
description: Downloads artifacts into $RUNNER_TEMP/in/<name> and verifies each against its SHA256SUMS and job digest.
inputs:
  pattern:
    description: Artifact name pattern
    required: true
  digests:
    description: Space-separated name=digest pairs, from the outputs of the jobs that made the artifacts
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ runner.temp }}/in
    # When the pattern matches a single artifact, download-artifact (v5+) unpacks it straight into the path; move it
    # into in/<name> like the rest, so verify-artifacts.sh sees one directory per artifact.
    - shell: bash
      run: |
        if [[ "$PATTERN" != *[\*\?\[\{]* ]] && [ ! -d "$RUNNER_TEMP/in/$PATTERN" ]; then
          mkdir "$RUNNER_TEMP/in.$PATTERN"
          find "$RUNNER_TEMP/in" -mindepth 1 -maxdepth 1 -exec mv -t "$RUNNER_TEMP/in.$PATTERN" {} +
          mv "$RUNNER_TEMP/in.$PATTERN" "$RUNNER_TEMP/in/$PATTERN"
        fi
      env:
        PATTERN: ${{ inputs.pattern }}
    - shell: bash
      run: bash "$GITHUB_ACTION_PATH/../verify-artifacts.sh" "$RUNNER_TEMP/in"
      env:
        BROWSE_DIGESTS: ${{ inputs.digests }}
